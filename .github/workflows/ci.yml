name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# CI is fully Neon-independent by design (kickoff plan): no preview DB
# branches, no DATABASE_URL. e2e (Playwright + Postgres service container)
# joins these checks in Phase 1 when auth exists.

jobs:
  typecheck:
    runs-on: ubuntu-latest
    # D-510 · eine Zeitgrenze, damit ein haengender Schritt nicht sechs Stunden blockiert
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    # D-510 · eine Zeitgrenze, damit ein haengender Schritt nicht sechs Stunden blockiert
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    runs-on: ubuntu-latest
    # D-510 · eine Zeitgrenze, damit ein haengender Schritt nicht sechs Stunden blockiert
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  content-validate:
    runs-on: ubuntu-latest
    # D-510 · eine Zeitgrenze, damit ein haengender Schritt nicht sechs Stunden blockiert
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm content validate
      - run: pnpm content validate-story
      # PLATT-K4a · W-0-Welle: die beiden Autoren-Tore der Hoer-/Schularbeits-Inhalte
      #   liefen bisher nur von Hand — Merge war Release, und nichts ausser
      #   Autoren-Disziplin hielt einen kaputten Schluessel von Kindern fern.
      #   (Opt-in per Bauart: `pnpm content validate` liest listening.json/test.json
      #   nicht, deshalb zwei eigene Zeilen und kein neues check-*.mjs.)
      - run: pnpm content validate-listening # K4a: V-LC1 Zitat-Treue · V-LC2 Gist-Disziplin · V-LC3 Echo-Koeder · V-LC4 Trick-Budget
      - run: pnpm content validate-test # K4a: V-LC1r/V-LC4r Lesen · V-EX1 Callout-Zitate · V-EX2 Mustertext ganz im Wortbestand · V-CK1 Checkliste in Du-Form
      # ══ DIE TORE, GEORDNET (R5-W6b · W5, letzte Merge-Position) ═══════════════
      #
      # Fünf Bahnen dieser Welle durften hier anhängen; W5 ordnet zuletzt. Die
      # Ordnung ist ein Gesetz und keine Kosmetik:
      #
      #   1 · Je Tor steht die SELBSTTEST-Zeile unmittelbar vor der echten Zeile.
      #       Ein Selbsttest, der zehn Zeilen entfernt läuft, wird beim Lesen
      #       eines roten Laufs nicht mitgelesen — und die erste Frage bei einem
      #       roten Tor ist immer: misst es überhaupt noch?
      #   2 · Jede Zeile nennt SESSION und GESETZ. Ein `- run:` ohne Herkunft ist
      #       in einem Jahr ein Schritt, den niemand zu löschen wagt und niemand
      #       versteht.
      #   3 · Die Werkzeuge stehen in EINEM Block, nicht verteilt. Sie sind kein
      #       Tor, und wer das über vier Stellen verteilt liest, hält irgendwann
      #       eines für eines (D-257, genau dieser Vorfall).
      #
      # R5-W7 · W6 · D-454 GESCHLOSSEN: die vier Tore, die keinen Selbsttest
      # hatten (check-story-grounding · check-paint-copy · check-paint-art ·
      # check-story-art), haben jetzt einen. Jeder speist eine Defektklasse ein,
      # die das Tor HEUTE schon fängt, und prüft, dass GENAU sie gemeldet wird —
      # ein Selbsttest, der die Klasse nicht trifft, ist schlimmer als keiner.
      # Jeder trägt zusätzlich den NICHT-TAMPER-Fall: der echte Stand muss grün
      # sein, sonst kann ein Tor, das auf alles rot geht, nicht von einem
      # arbeitenden unterschieden werden.
      # (Die erste Fassung dieser Kommentare schrieb dort das Flag AUS —
      # worauf check-ci-gates die echte Zeile für eine Selbsttest-Zeile hielt
      # und vier Tore als »läuft nie an einer echten Datei« meldete. Der
      # Wächter liest ZEILEN, nicht Befehle; er hat damit recht behalten.)

      # ── Inhalt: Text, Karten, Level ──────────────────────────────────────────
      - run: node --experimental-strip-types scripts/check-story-grounding.mjs --selftest # W6/D-454: vier echte Defekte müssen rot werden (ungegroundetes Wort · Register · Giveaway · Aufgabe in einer Zeremonie-Szene) und der echte Korpus grün bleiben
      - run: node --experimental-strip-types scripts/check-story-grounding.mjs # W3/D-123: jedes verbotene deutsche Wort kommt aus content-schema (.ts) — das Flag ist, was es erlaubt
      - run: node --experimental-strip-types scripts/check-paint-copy.mjs --selftest # W6/D-454: sechs echte Defekte müssen rot werden (Umhang · Zitat · Register · zurückgezogene Wendung · Grounding eines Beispiels · ein Streifer, der die Kopie frisst) und der echte Stand grün bleiben
      - run: node --experimental-strip-types scripts/check-paint-copy.mjs # C1: Umhang-, Register- und Zitat-Gesetz über der Schalen-Kopie
      - run: node scripts/check-copy-register.mjs --selftest # C2: das rote Licht des Register-Tors muss erreichbar sein
      - run: node scripts/check-copy-register.mjs # C2: jede deutsche Zeile, die ein Kind liest, ist österreichisch (scripts/lexikon-at.json)
      - run: node scripts/check-design-sheets.mjs --selftest # W4/D-278 + W5/D-424: das Register-Gesetz trennt den Schrei vom Schreiben (Teilkette gegen Wortgrenze) und lässt den Kanon-Begriff »Tinten-Geister« durch, ohne »Geist« freizugeben
      - run: node scripts/check-design-sheets.mjs # W4/K5: kein Angst-Wort auf einem Design-Blatt, alle Korpus-ids und Abschnitte vorhanden
      - run: node --experimental-strip-types scripts/check-game-tasks.mjs --selftest # G2: das rote Licht des Karten-Tors muss erreichbar sein — je Klasse eine vorbereitete Verräter-Karte
      - run: node --experimental-strip-types scripts/check-game-tasks.mjs # PB-T6: gameTasks@2 Schema + Erdung + Verrat (Schicht 18: alle neun Arten, beide Sprachen, das Brett)
      - run: node scripts/check-level-design.mjs --selftest # B1: das rote Licht des Tors muss erreichbar sein
      - run: node scripts/check-level-design.mjs # R5-P1/B1: Stem-Dedup, Vokabel-Abdeckung, Dossier↔Level-Anker, benannte Schwellen
      - run: node scripts/check-registers.mjs --selftest # K1: das rote Licht des Register-Tors muss erreichbar sein
      - run: node scripts/check-registers.mjs # K1: D-/PB-Nummern eindeutig, Code-Verweise lösen per SYMBOL auf, nie per Zeile
      - run: node scripts/check-roster-twins.mjs --selftest # K9b-Review: das rote Licht muss erreichbar sein — je eine im Speicher verbogene Kopie (Regel-Block · Fixture-Liste) muss gemeldet werden, die echten Dateien grün bleiben
      - run: node scripts/check-roster-twins.mjs # K9b-Review: die Parse-Regel lebt zweimal (@domigo/db ist server-only) — driftet eine Hälfte, zeigt die Prüfliste eine andere Zahl, als der Server anlegt
      - run: node scripts/check-journal-door.mjs --selftest # PLATT-PR8/P-R8: das rote Licht muss erreichbar sein — je eine im Speicher erfundene Vorbei-Schreibstelle (drizzle · rohes SQL) muss gemeldet werden, und eine Ausnahme ohne Verstoß muss als VERALTET auffallen
      - run: node scripts/check-journal-door.mjs # PLATT-PR8/P-R8: jede roster_events-Zeile geht durch writeRosterEvent — nur dort wird die Nutzlast gegen das Vokabular geprüft, damit nie wieder ein Kindername im Journal landet

      # ── Bild: was auf den Blättern wirklich steht ────────────────────────────
      - run: node --experimental-strip-types scripts/check-paint-art.mjs --selftest # W6/D-454: vier echte Defekte müssen rot werden (fehlendes Blatt · schale Ausnahme · Ausnahme ohne Bedarf · die Tot-Kunst-Ratsche, ausgelöst über EIN Blatt mehr in der Welt statt über eine gedrehte Decke) und der echte Stand grün bleiben
      - run: node --experimental-strip-types scripts/check-paint-art.mjs # PB-T2: keine stille Platzhalter-Kunst; und die Tot-Kunst-Ratsche (DEAD_ART_CEILING)
      - run: node scripts/check-story-art.mjs --selftest # W6/D-454: beide Richtungen müssen rot werden können (art.json nennt einen Stem ohne Prompt · die Bibliothek definiert einen, den art.json nie nennt) und der _neutral-Rückfall darf keinen Fehlalarm auslösen
      - run: node scripts/check-story-art.mjs # das Story-Kunst-Manifest und die Prompt-Bibliothek stimmen überein, in beide Richtungen
      - run: node scripts/check-composition.mjs --selftest # A6: das rote Licht des Kanten-Kohärenz-Gesetzes muss erreichbar sein · L1/R5-W6: die Buchstaben-Präsenz mit ihrem Tamper (goldene Wand OHNE Hof ⇒ rot) · W5/R5-W6b: EINE Farbton-Rechnung (beide Leser, derselbe Winkel)
      - run: node scripts/check-composition.mjs # PB-C1/doc 36: Ebenen-Abdeckung, geschnittene Masse, Wertbänder, keine nackte Füllung, Kanten-Kohärenz, Buchstaben-Präsenz (R37)
      - run: node --experimental-strip-types scripts/check-png-seams.mjs --selftest # W3/D-199: das rote Licht des Naht-Tors muss erreichbar sein — und echt violette Malerei muss grün bleiben
      - run: node --experimental-strip-types scripts/check-png-seams.mjs # W3/D-199: Magenta INNERHALB einer deckenden Kachel — die Klasse, die das reine Haut-Fransen-Tor nicht sieht
      - run: node --experimental-strip-types scripts/check-body-silhouette.mjs --selftest # N6/R6: das rote Licht des Silhouetten-Tors muss erreichbar sein — drei Tamper (Kern-Deckung · Alpha ausserhalb · Lauf-Linie)
      - run: node --experimental-strip-types scripts/check-body-silhouette.mjs # N6/R6: jeder deklarierte Koerper (CH01_BODIES) haelt die drei Gesetze — Kern-Deckung ≥98 %, Alpha ausserhalb Maske+Overpaint ≤0,5 %, Lauf-Linie im Fenster [-8,+2] px
      - run: node --experimental-strip-types scripts/make-body-stencils.mjs --selftest # N7A1/D-957: der Schablonen-Erzeuger baut die sechs committeten p2-Masken nach (Pixel-Gleichheit) und sieht seinen Tamper rot — die sechs Masken lagen in d89bbe4d ohne erzeugendes Skript, und ein Werkzeug ohne Selbsttest in CI ist wieder eine Behauptung
      - run: node --experimental-strip-types scripts/retire-phase-art.mjs --selftest # N7A2: der Loesch-Waechter urteilt darueber, welche PNGs eine Bahn von der Platte nehmen darf (zwei Bedingungen: der Stem traegt den Raum im Namen UND kein Raum laedt ihn noch). Der Selbsttest faellt sieben Urteile — zwei Freigaben, fuenf Verweigerungen (ein geteiltes Blatt, ein fremder Raum, ein LEBENDES Koerper-Blatt) — plus einen Tamper darauf, dass ohne die Eigentums-Bedingung ein geteiltes Blatt durchginge. Dieselbe Luecke wie make-body-stencils nach #389 (D-957): ein Werkzeug, das loescht, und dessen Selbsttest nirgends laeuft, ist wieder eine Behauptung
      - run: node --experimental-strip-types scripts/check-ground-plane.mjs --selftest # N6/R7: das rote Licht des Aufstands-Tors muss erreichbar sein (Gesetz 13: V-Sockel und Kipp werden rot)
      - run: node --experimental-strip-types scripts/check-ground-plane.mjs # N6/R7 · Checkliste 13: EINE orthografische Bodenebene — jedes Steh-Blatt mit gerader Aufstandskante (Reichweite ≥80 %, Kipp ≤3°); Altbestand datiert geduldet, jede Zeile stirbt mit ihrem Blatt
      - run: node scripts/check-colour-truth.mjs --selftest # C2 + C4: beide Kapitel zählen getrennt — die Messung muss ein rotes Blatt rot nennen können, und die Kopie muss die falsche Farbe im Hinweis finden
      - run: node scripts/check-colour-truth.mjs # C2/R41 + C4/D-280 (W5/D-420: eine Datei, zwei Kapitel): jede restore-Karte trägt die Farbfamilie ihres eigenen PNG — und die deutschen Zeilen der Karte nennen die Farbe, die die Karte kodiert
      - run: node scripts/check-sheet-colours.mjs --selftest # W5/D-403: das rote Licht der Farbzahl je ZELLE muss erreichbar sein — ein posterisiertes Blatt wird rot, das echte bleibt grün
      - run: node scripts/check-sheet-colours.mjs # W5/D-403+D-404: jede Zelle einzeln gezählt (nie als Summe einer Sammeldatei) hält 80 % ihrer Farbzahl, und jede Abweichung vom Helligkeits-Korridor trägt eine benannte, datierte Ausnahme
      # ── R5-W7 · W6 · Schlusspass: die Importeur-Selbsttests stehen ALPHABETISCH.
      #    Sie sind in ANKUNFTS-Reihenfolge gewachsen (aq15 · aq12 · as · aq13 · aq17),
      #    und in einer Ankunfts-Liste sieht niemand, dass einer FEHLT. Sortiert ist
      #    die Luecke sichtbar, ohne dass man zaehlen muss — dasselbe Argument wie
      #    Gesetz 3 oben fuer den Werkzeug-Block. `check-ci-gates` prueft die MENGE
      #    (Gesetz 5/6, C10); diese Ordnung ist fuer das menschliche Auge.
      - run: node docs/art/import-batch-aq12.mjs --selftest # C5: die Abnahme-Probe muss eine flache Füllung weiterhin eine flache Füllung nennen können
      - run: node docs/art/import-batch-aq13.mjs --selftest # H4 + H5/R200·R203·R205: die Tafel- und Ring-Abnahme misst gegen den BESTAND, nicht gegen die Zahlen des Lieferscheins — Zwilling, unten buendiger Sitz und Gesichtsquote gegen ein selbst gerechnetes N muessen rot werden; dazu die vier Ring-Maschen (gespiegelte Naht · bytegenaue Wrap-Kopie · einseitige Lasur · balancierter Jitter), die Schiefer-Helligkeit auf der VOLLEN Maske und die Overlay-Ausnahme, die auf Bytes sitzt und nicht auf einem Namen
      - run: node docs/art/import-batch-aq15.mjs --selftest # C6: die Fenster-Abnahme muss den abgeschnittenen Stabfuss sehen — der Fehler, den eine Pruefung mit der Oeffnungsmaske des Lieferanten per Bauart uebersieht
      - run: node docs/art/import-batch-aq17.mjs --selftest # D5/R187c: die Karten-Abnahme liest die vier Eckradien aus dem Stylesheet und nicht aus sich selbst — eine Plakette mit EINEM Radius muss rot werden, und die Haltung des 9-Slice hat ihr eigenes rotes Licht, falls eine spaetere Lieferung die Bestellung doch erfuellt
      - run: node scripts/check-png-identity.mjs --selftest # E5: das rote Licht des Bildpunkt-Beweises muss erreichbar sein
      # W4/D-257 + D-98: der ECHTE Lauf. Nur auf einem PR, weil er gegen die
      # Basis vergleicht — auf einem Push nach main gibt es keine. Neu gemalte
      # Blätter sind ausdrücklich erlaubt; rot wird genau die Klasse, die D-98
      # gemessen hat: identische Bildpunkte in einer GEWACHSENEN Datei, also ein
      # Skript, das E5s verlustfreie Nachverdichtung still zurückgenommen hat.
      - name: D-98 · geänderte PNGs gegen die Basis — gleiche Bildpunkte dürfen nicht wachsen
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/check-png-identity.mjs --ref FETCH_HEAD

      # ── Budgets, Schrift, Geheimnisse ───────────────────────────────────────
      - run: node --experimental-strip-types scripts/check-perf-budget.mjs --selftest # E5: das rote Licht des Budget-Wächters muss erreichbar sein
      - run: node --experimental-strip-types scripts/check-perf-budget.mjs # E5: die PERF_WAECHTER-Zahlen, der Code und die Vollstrecker müssen übereinstimmen
      - run: node scripts/check-fonts.mjs --selftest # E5: das rote Licht des Schrift-Wächters muss erreichbar sein
      - run: node scripts/check-fonts.mjs # E5/D-79: kein next/font/google — der Bau darf nicht davon abhängen, dass gstatic läuft
      - run: node scripts/check-secrets.mjs --selftest # S1: vier Köder müssen rot werden UND sechs Beinahe-Treffer still bleiben
      - run: node scripts/check-secrets.mjs # S1: kein API-Schlüssel in einer getrackten Datei — die Historie behält, was einmal drin war

      # ── Klang ───────────────────────────────────────────────────────────────
      # S1: das Klang-Tor MISST Klang (Lautheit, Spitze, Klangfarbe, Schleifen-Naht) und braucht dafür
      # ffmpeg. ubuntu-latest bringt keins mit. Die Alternative wäre ein Tor, das in CI nur Bytes und
      # Prüfsummen vergleicht und die Signal-Messung dem Laptop überlässt — also ein Tor, das die
      # Klasse von Fehlern, für die es gebaut wurde, in CI nie sieht (P-65). Der Schritt kostet Sekunden.
      # 19.08.: dieser Schritt hing 56 Minuten an einem Paket-Spiegel und blockierte das
      # Boot-Tor der ganzen Welle 7. Er kostet normal Sekunden; eine Zeitgrenze macht aus
      # einem Haenger einen roten Schritt, den ein Neustart behebt (die Klasse, nicht der Fall).
      #
      # ── R5-W7 · W6 · D-510, die Verfeinerung ──────────────────────────────
      # Die Frage aus dem Register war: Wiederholversuch, gecachtes ffmpeg oder
      # harter Abbruch? Die gemessene Fehlerklasse ist ein HAENGENDER Spiegel,
      # kein schnelles Fehlschlagen — deshalb bringt ein blosser Wiederholversuch
      # nichts: der erste Anlauf kaeme nie zurueck, und die Job-Frist faellt
      # trotzdem. Was hilft, ist eine eigene Frist JE ANLAUF. Zwei Anlaeufe mit
      # je 100/120 s bleiben zusammen unter der Schritt-Frist und machen aus dem
      # 56-Minuten-Vorfall einen Aussetzer von zwei Minuten, den niemand von Hand
      # neu starten muss.
      # GEGEN das Zwischenlager (Cache): ffmpeg ist ein SYSTEM-Paket mit
      # Abhaengigkeiten; ein Cache muesste Pfade und Schluessel pflegen, braucht
      # fuer die Abhaengigkeiten weiterhin apt, und er kauft Sekunden gegen eine
      # Fehlerklasse, die die Frist oben schon begrenzt. Mehr bewegliche Teile
      # fuer weniger Gewinn.
      # UND: der Schritt beweist am Ende, dass ffmpeg wirklich da ist — ein
      # `apt-get`, das still nichts installiert, waere sonst ein gruener Schritt
      # vor einem Klang-Tor, das nichts messen kann.
      - name: "ffmpeg fuer das Klang-Tor — zwei Anlaeufe, jeder mit eigener Frist (D-510)"
        timeout-minutes: 6
        run: |
          hol() {
            sudo timeout 100 apt-get update -qq && sudo timeout 120 apt-get install -y -qq ffmpeg
          }
          hol || {
            echo "::warning::erster ffmpeg-Anlauf fehlgeschlagen oder haengend (D-510) — zweiter in 10 s"
            sleep 10
            hol
          }
          ffmpeg -version | head -1
      - run: node scripts/check-audio.mjs --selftest # S1: fünf echte Defekte müssen rot werden — und ein AUFSTEIGENDER Klang muss grün bleiben
      - run: node scripts/check-audio.mjs # S1/R124: Manifest ↔ Platte ↔ Messdatei, Budgets, und BLUEPRINT :371 als Messung

      # ── WERKZEUG, KEIN TOR (W4/D-257) ───────────────────────────────────────
      # Die Zeilen dieses Blocks fahren in CI ABSICHTLICH nur ihren Selbsttest:
      # der sichert das Messgerät, der echte Lauf braucht Chrome, einen laufenden
      # Dev-Server oder schreibt Blätter — und gehört deshalb in die Sitzung,
      # neben die Bilder, die er erzeugt. Jedes `scripts/check-*.mjs` darin ist
      # in scripts/check-ci-gates.mjs#SELFTEST_ONLY mit Grund deklariert; fällt
      # die Deklaration weg oder wird ein echter Lauf verdrahtet, geht
      # check-ci-gates rot.
      #
      # ⚠ HIER STAND EINE ZAHL. »Diese sieben Zeilen« — es waren neun, seit E6
      # niemand mehr nachgezählt hat (W5 hatte denselben Satz schon einmal
      # repariert). Eine Zahl in einem Kommentar ist eine Behauptung, die kein
      # Tor prüft; sie ist deshalb weg und nicht korrigiert worden (R5-W8 · W7).
      #
      # R5-W8 · W7 (Schluss-Pass): geordnet nach dem, was die Werkzeuge TUN — vorher
      # standen sie in der Reihenfolge, in der sie ueber sechs Wellen dazukamen, und
      # eine neue Zeile landete jeweils dort, wo gerade Platz war.
      # MESSEN — sie lesen ein fertiges Bild oder einen fertigen Schirm.
      - run: node scripts/measure-presence.mjs --selftest # J1-E: das Kontrast-Messgerät beweist sich selbst, sonst bedeuten seine Zahlen nichts — misst am Schirm
      - run: node scripts/measure-motion.mjs --selftest # W1: gezeichnete gegen gesehene Bewegung — eine Scherung darf nicht als Null gelesen werden — misst eine geschossene Bildreihe
      - run: node scripts/measure-veil.mjs --selftest # D3: wie dunkel die Welt hinter der Karte ist — die Trennung muss eine große helle Karte überleben — braucht die offene Karte im laufenden Spiel
      - run: node scripts/measure-residue.mjs --selftest # W5/D-386: Gold und Kontur bleiben in ihren eigenen Zeilen, der stehengebliebene Flicken wird gefunden und verortet — braucht zwei Blätter (Bestand + Lieferung), die im Repo nicht beide liegen
      # FOTOGRAFIEREN — sie erzeugen das Bild erst und muessen dabei beweisen, dass sie nicht luegen.
      - run: node scripts/frame-sink.mjs --selftest # W1/P-66 + W7/P7 §12.8: die Kamera beweist, dass sie lebt, sonst geht ein Standbild als Beweis durch; und der erklärte Standbild-Zustand nimmt GENAU EIN Bild an, während dieselbe Folge OHNE die Flagge weiter mit 425 abbricht (der Tamper sitzt darauf) — nimmt Bilder aus einem laufenden Browser entgegen
      - run: node scripts/shoot-world.mjs --selftest # W4/D-259 + W6/D-443 + W7/P7 §12.8: die Kampf-Abtastrate liegt unter beiden Kampf-Takten (entities.ts), der Beipackzettel erscheint, wenn das Werkzeug mitgespielt hat, EINE geänderte Level-Zelle wird an der ausgelieferten Seite gefunden — und der Standbild-Plan trennt »EIN Bild« von »Handschlag entfällt« (er entfällt nur bei stehender Welt) sowie Bewegungs- von Handlungstasten (↑ bewegt nicht, es HANDELT) — der Lauf braucht Chrome + Dev-Server
      - run: node scripts/shoot-card-bench.mjs --selftest # W2/D-102 + W5 + W7/P7 §13: die Ausschnitt-Rechnung der Kartenbank (ein Motiv unter 40 % der Bildfläche muss rot werden), die je Fläche ERKLÄRTE Schwelle greift nur dort, wo sie erklärt ist (sonst wäre sie eine globale Senkung), und der Bericht des Weiterlaufs nennt jeden Fehlschlag mit eigenem Grund und endet trotzdem mit 1 — startet einen eigenen Chrome
      # DIE MASCHINE — sie messen die Umgebung, gegen die alles andere misst.
      - run: node scripts/perf-visible.mjs --selftest # E6/R115: hier läuft kein Chrome; geprüft wird nur, dass die Kontrollschwelle (Kontrollseite unter 58 fps ⇒ Abbruch) ihr rotes Licht erreichen kann. Die Maschinen-Lesung des Laufs (W7/P7 §12.9) hat ihren eigenen Selbsttest in chrome-hygiene
      - run: node scripts/chrome-hygiene.mjs --selftest # W6/D-438 + W5-Falle 1 + W7/P7 §12.9: eigene Chrome-Profile werden erkannt, FREMDE Browser nie angefasst, die pgrep -f-Selbstfindung ist ausgeschlossen, das eigene PROFIL trennt den eigenen vom fremden Lauf desselben Werkzeugs (der Präfix kann das nicht), und der Maschinen-Makel (Last · fremder Mess-Browser · fremder Server im Band 3200–3399) geht an und aus — der echte Lauf braucht laufende Browser
      # SCHREIBEN — ihr echter Lauf veraendert die Arbeitskopie und gehoert deshalb in die Sitzung.
      - run: node scripts/art-recompress.mjs --selftest # W5/D-339: die Doppellauf-Sperre — eine TOTE Sperre wird übernommen, eine lebende hält, ein laufendes oxipng schlägt beides; der echte Lauf schreibt PNGs und gehört in die Sitzung
      - run: node scripts/set-plane-value.mjs --selftest # W7/R209f-D-554 (C10, neu in dieser Bahn): der Wertepass trifft seinen deklarierten Zielwert ohne die Sättigung zu bewegen — UND ein Blatt, dessen RGB-sha256 einem Wareneingangs-Pin entspricht, wird verweigert statt still überschrieben; der Tamper sitzt auf den Bytes (ein Pin auf fremde Bytes sperrt nicht, ein geändertes Byte fällt heraus). Der echte Lauf SCHREIBT Blätter und gehört in die Sitzung

      # ── zuletzt: das Tor, das diese Datei bewacht ────────────────────────────
      - run: node scripts/check-ci-gates.mjs --selftest # E2: das rote Licht des Wächters muss erreichbar sein
      - run: node scripts/check-ci-gates.mjs # E2: jedes Tor auf der Platte ist in DIESER Datei verdrahtet — die Lücke kann nicht wieder aufgehen

  perf-contract:
    # R5-W3 · E5 · docs/PERF_WAECHTER.md §1: no PR that touches rendering,
    # assets, entities or the card DOM ships without its before/after numbers.
    # Pull requests only — there is no PR body on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # D-510 · eine Zeitgrenze, damit ein haengender Schritt nicht sechs Stunden blockiert
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/check-perf-table.mjs --selftest # the detector must tell a filled table from a blank one — und seit W7 ist eine ausgefüllte Tabelle OHNE Bau-Angabe rot (D-514s Aufschub ist abgelaufen); der Anker »Bau: … · Quelle: …« wird direkt geprüft, damit ein deutsches »Bau:« im Fließtext keinen fremden PR rot färbt
      - name: the PERF_WAECHTER table is present when it is owed
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # R5-W6b · W5: OHNE --depth=1. Der flache Hol-Vorgang liefert einen
          # origin/main OHNE Eltern; sobald main dem PR-Stand voraus ist, hat
          # `...` (Drei-Punkt = gemeinsamer Vorfahr) keinen mehr, und der
          # Schritt endet mit »fatal: no merge base« — ein ROTES Tor, das nichts
          # ueber die Tabelle sagt, die es prueft. Genau das ist an diesem PR
          # passiert, als zwei Bahnen der Welle vor ihm gemergt wurden.
          # Der Checkout dieses Jobs hat fetch-depth: 0, die volle Historie
          # kostet hier also nichts.
          git fetch --no-tags origin "${{ github.base_ref }}" > /dev/null 2>&1 || true
          CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          export CHANGED_FILES
          node scripts/check-perf-table.mjs

  build:
    runs-on: ubuntu-latest
    # D-510 · eine Zeitgrenze, damit ein haengender Schritt nicht sechs Stunden blockiert
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:bundle # Phaser stays in one lazy chunk; no shared-bundle leak (Law 9)
