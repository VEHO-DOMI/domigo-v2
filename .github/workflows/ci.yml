name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# CI is fully Neon-independent by design (kickoff plan): no preview DB
# branches, no DATABASE_URL. e2e (Playwright + Postgres service container)
# joins these checks in Phase 1 when auth exists.

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  content-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm content validate
      - run: pnpm content validate-story
      - run: node --experimental-strip-types scripts/check-story-grounding.mjs # W3/D-123: imports BANNED_DE from content-schema (.ts) — the flag is what lets it
      - run: node scripts/check-design-sheets.mjs --selftest # W4/D-278: das Register-Gesetz trennt den Schrei vom Schreiben — Teilkette gegen Wortgrenze
      - run: node scripts/check-design-sheets.mjs
      - run: node --experimental-strip-types scripts/check-paint-art.mjs # PB-T2: no silent placeholder art
      - run: node --experimental-strip-types scripts/check-game-tasks.mjs --selftest # G2: the card gate's own red light must be reachable — one prepared traitor card per class
      - run: node --experimental-strip-types scripts/check-game-tasks.mjs # PB-T6: gameTasks@2 schema + grounding + giveaway (layer 18: all nine kinds, both languages, the board)
      - run: node scripts/check-story-art.mjs # the story-art manifest and the prompt library agree, both ways
      - run: node scripts/check-level-design.mjs --selftest # B1: the gate's own red light must be reachable
      - run: node scripts/check-level-design.mjs # R5-P1/B1: stem dedup, vocab coverage, dossier↔level anchors, named thresholds
      - run: node scripts/check-composition.mjs --selftest # A6: the edge-coherence law's own red light must be reachable — und L1/R5-W6: die Buchstaben-Praesenz mit ihrem Tamper (goldene Wand OHNE Hof ⇒ rot)
      - run: node scripts/check-composition.mjs # PB-C1/doc 36: plane coverage, carved mass, value bands, no naked fill, edge coherence, letter presence (R37)
      - run: node --experimental-strip-types scripts/check-png-seams.mjs --selftest # W3/D-199: the seam gate's own red light must be reachable — and genuinely violet paint must stay green
      - run: node --experimental-strip-types scripts/check-png-seams.mjs # W3/D-199: magenta INSIDE an opaque tile — the class the skin-only fringe gate cannot see
      - run: node --experimental-strip-types scripts/check-paint-copy.mjs # C1: cloak, register and quote laws over the shell copy
      - run: node scripts/check-copy-register.mjs --selftest # C2: the register gate's own red light must be reachable
      - run: node scripts/check-copy-register.mjs # C2: every German line a child reads is Austrian (scripts/lexikon-at.json)
      - run: node scripts/check-colour-truth.mjs --selftest # C2: the colour measurement must be able to call a red sheet red
      - run: node scripts/check-colour-truth.mjs # C2/R41 + C4/D-280 (W5/D-420: eine Datei, zwei Kapitel): jede restore-Karte traegt die Farbfamilie ihres eigenen PNG — und die deutschen Zeilen der Karte nennen die Farbe, die die Karte kodiert
      - run: node scripts/check-sheet-colours.mjs --selftest # W5/D-403: das rote Licht der Farbzahl je ZELLE muss erreichbar sein — ein posterisiertes Blatt wird rot, das echte bleibt gruen
      - run: node scripts/check-sheet-colours.mjs # W5/D-403+D-404: jede Zelle einzeln gezaehlt (nie als Summe einer Sammeldatei) haelt 80 % ihrer Farbzahl, und jede Abweichung vom Helligkeits-Korridor traegt eine benannte, datierte Ausnahme
      - run: node docs/art/import-batch-aq12.mjs --selftest # C5: the import acceptance probe must still be able to call a flat fill a flat fill
      - run: node docs/art/import-batch-aq15.mjs --selftest # C6: die Fenster-Abnahme muss den abgeschnittenen Stabfuss sehen — der Fehler, den eine Pruefung mit der Oeffnungsmaske des Lieferanten per Bauart uebersieht
      - run: node docs/art/import-batch-aq13.mjs --selftest # H4: die Tafel- und Ring-Abnahme misst gegen den BESTAND, nicht gegen die Zahlen des Lieferscheins — der Zwilling, der unten buendige Sitz und die Gesichtsquote gegen ein selbst gerechnetes N muessen rot werden
      # ── W4/D-257 · die vier Zeilen hier und shoot-card-bench unten sind
      # WERKZEUG, KEIN TOR: der Selbsttest sichert das Messgerät, der echte Lauf
      # braucht Chrome und einen Dev-Server und gehört deshalb in die Session,
      # neben die Bilder, die er erzeugt. Jede Zeile ist in
      # scripts/check-ci-gates.mjs#SELFTEST_ONLY mit Grund deklariert; fällt die
      # Deklaration weg oder wird ein echter Lauf verdrahtet, geht das Tor rot.
      - run: node scripts/measure-presence.mjs --selftest # J1-E: the contrast instrument proves itself, or its numbers mean nothing — Werkzeug, kein Tor (misst am Schirm)
      - run: node scripts/frame-sink.mjs --selftest # W1/P-66: the camera proves it is alive, or a still frame ships as evidence — Werkzeug, kein Tor (nimmt Bilder aus einem laufenden Browser entgegen)
      - run: node scripts/measure-motion.mjs --selftest # W1: drawn-vs-seen motion — a shear must not read as zero — Werkzeug, kein Tor (misst eine geschossene Bildreihe)
      - run: node scripts/measure-veil.mjs --selftest # D3: how dark the world behind the card is — the split must survive a big bright card — Werkzeug, kein Tor (braucht die offene Karte im laufenden Spiel)
      - run: node scripts/check-registers.mjs --selftest # K1: the register gate's own red light must be reachable
      - run: node scripts/check-registers.mjs # K1: D-/PB-numbers unique, code references resolve by SYMBOL not by line
      - run: node scripts/check-png-identity.mjs --selftest # E5: the pixel-identity proof's own red light must be reachable
      # W4/D-257 + D-98: der ECHTE Lauf. Nur auf einem PR, weil er gegen die
      # Basis vergleicht — auf einem Push nach main gibt es keine. Neu gemalte
      # Blätter sind ausdrücklich erlaubt; rot wird genau die Klasse, die D-98
      # gemessen hat: identische Bildpunkte in einer GEWACHSENEN Datei, also ein
      # Skript, das E5s verlustfreie Nachverdichtung still zurückgenommen hat.
      - name: D-98 · geänderte PNGs gegen die Basis — gleiche Bildpunkte dürfen nicht wachsen
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/check-png-identity.mjs --ref FETCH_HEAD
      - run: node --experimental-strip-types scripts/check-perf-budget.mjs --selftest # E5: the budget guard's own red light must be reachable
      - run: node --experimental-strip-types scripts/check-perf-budget.mjs # E5: the PERF_WAECHTER numbers, the code and the enforcers must agree
      - run: node scripts/check-fonts.mjs --selftest # E5: the font guard's own red light must be reachable
      - run: node scripts/check-fonts.mjs # E5/D-79: no next/font/google — the build may not depend on gstatic being up
      - run: node scripts/shoot-card-bench.mjs --selftest # W2/D-102: die Ausschnitt-Rechnung der Kartenbank — ein Motiv unter 40 % der Bildflaeche muss rot werden — Werkzeug, kein Tor (startet einen eigenen Chrome)
      - run: node scripts/shoot-world.mjs --selftest # W4/D-259: die Kampf-Abtastrate liegt unter beiden Kampf-Takten (entities.ts) und der Beipackzettel erscheint, wenn das Werkzeug mitgespielt hat — Werkzeug, kein Tor (der Lauf braucht Chrome + Dev-Server)
      - run: node scripts/perf-visible.mjs --selftest # E6/R115: Werkzeug, kein Tor — hier laeuft kein Chrome; geprueft wird nur, dass die Kontrollschwelle (Kontrollseite unter 58 fps ⇒ Abbruch) ihr rotes Licht erreichen kann
      - run: node scripts/check-secrets.mjs --selftest # S1: vier Koeder muessen rot werden UND sechs Beinahe-Treffer still bleiben
      - run: node scripts/check-secrets.mjs # S1: kein API-Schluessel in einer getrackten Datei — die Historie behaelt, was einmal drin war
      # S1: das Klang-Tor MISST Klang (Lautheit, Spitze, Klangfarbe, Schleifen-Naht) und braucht dafuer
      # ffmpeg. ubuntu-latest bringt keins mit. Die Alternative waere ein Tor, das in CI nur Bytes und
      # Pruefsummen vergleicht und die Signal-Messung dem Laptop ueberlaesst — also ein Tor, das die
      # Klasse von Fehlern, fuer die es gebaut wurde, in CI nie sieht (P-65). Der Schritt kostet Sekunden.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node scripts/check-audio.mjs --selftest # S1: fuenf echte Defekte muessen rot werden — und ein AUFSTEIGENDER Klang muss gruen bleiben
      - run: node scripts/check-audio.mjs # S1/R124: Manifest ↔ Platte ↔ Messdatei, Budgets, und BLUEPRINT :371 als Messung
      - run: node scripts/check-ci-gates.mjs --selftest # E2: the guard's own red light must be reachable
      - run: node scripts/check-ci-gates.mjs # E2: every gate on disk is wired into THIS file — the gap cannot reopen

  perf-contract:
    # R5-W3 · E5 · docs/PERF_WAECHTER.md §1: no PR that touches rendering,
    # assets, entities or the card DOM ships without its before/after numbers.
    # Pull requests only — there is no PR body on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/check-perf-table.mjs --selftest # the detector must tell a filled table from a blank one
      - name: the PERF_WAECHTER table is present when it is owed
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" > /dev/null 2>&1 || true
          CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          export CHANGED_FILES
          node scripts/check-perf-table.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:bundle # Phaser stays in one lazy chunk; no shared-bundle leak (Law 9)
